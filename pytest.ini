[pytest]
# Pytest configuration for OmniChatX

# Test paths
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    e2e: marks tests as end-to-end tests
    smoke: marks tests as smoke tests (quick validation)

# Async mode
asyncio_mode = auto

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage settings
addopts = 
    -v
    --tb=short
    --strict-markers
    -ra
    --ignore=notebooks/
    --ignore=experiments/
    --ignore=multipart_shadow/

# Timeout for tests (requires pytest-timeout)
timeout = 60

# Minimum Python version
minversion = 3.9

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:transformers.*
    ignore::FutureWarning

# Output
console_output_style = progress

# Parallelization (requires pytest-xdist)
# Use with: pytest -n auto
# n = auto
