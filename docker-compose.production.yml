# ============================================
# Sentifargo Production Docker Compose
# Complete stack with monitoring & caching
# ============================================

version: "3.9"

services:
  # ==========================================
  # Main API Service
  # ==========================================
  Sentifargo-api:
    build:
      context: .
      dockerfile: Dockerfile.production
      target: production
    container_name: Sentifargo-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - APP_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - AUTH_TOKEN=${AUTH_TOKEN:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/Sentifargo.db}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - MAX_REQUEST_SIZE=${MAX_REQUEST_SIZE:-50MB}
    volumes:
      - ./data:/app/data:rw
      - ./logs:/app/logs:rw
      - ./models:/app/models:ro
      - ./artifacts:/app/artifacts:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - Sentifargo-network
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ==========================================
  # Streamlit UI Service
  # ==========================================
  Sentifargo-ui:
    build:
      context: .
      dockerfile: Dockerfile.production
      target: production
    container_name: Sentifargo-ui
    restart: unless-stopped
    ports:
      - "${UI_PORT:-8501}:8501"
    environment:
      - Sentifargo_BACKEND=http://Sentifargo-api:8000
      - AUTH_TOKEN=${AUTH_TOKEN:-}
    volumes:
      - ./models:/app/models:ro
      - ./artifacts:/app/artifacts:ro
      - ./experiments:/app/experiments:ro
    command: >
      streamlit run app/streamlit_chatbot/app.py
      --server.port=8501
      --server.address=0.0.0.0
      --server.headless=true
      --browser.gatherUsageStats=false
      --theme.base=dark
      --theme.primaryColor=#3b82f6
    depends_on:
      Sentifargo-api:
        condition: service_healthy
    networks:
      - Sentifargo-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  # ==========================================
  # Redis Cache
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: Sentifargo-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - Sentifargo-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # ==========================================
  # Prometheus Metrics
  # ==========================================
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: Sentifargo-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - Sentifargo-network
    profiles:
      - monitoring

  # ==========================================
  # Grafana Dashboard
  # ==========================================
  grafana:
    image: grafana/grafana:10.2.0
    container_name: Sentifargo-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - Sentifargo-network
    profiles:
      - monitoring

  # ==========================================
  # Nginx Reverse Proxy (Production)
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: Sentifargo-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - Sentifargo-api
      - Sentifargo-ui
    networks:
      - Sentifargo-network
    profiles:
      - production

# ==========================================
# Networks
# ==========================================
networks:
  Sentifargo-network:
    driver: bridge
    name: Sentifargo-network

# ==========================================
# Volumes
# ==========================================
volumes:
  redis-data:
    name: Sentifargo-redis-data
  prometheus-data:
    name: Sentifargo-prometheus-data
  grafana-data:
    name: Sentifargo-grafana-data
