services:
  postgres:
    image: postgres:16
    container_name: sentifargo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentifargo}
      POSTGRES_USER: ${POSTGRES_USER:-sentifargo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentifargo} -d ${POSTGRES_DB:-sentifargo}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [sentifargo]

  redis:
    image: redis:7-alpine
    container_name: sentifargo-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [sentifargo]

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.production
      target: production
    container_name: sentifargo-migrate
    restart: "no"
    command: alembic upgrade head
    environment: &api-env
      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      AUTH_TOKEN: ${AUTH_TOKEN:-}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS must be set}
      FORCE_HTTPS: "true"
      ENABLE_LEGACY_RUNTIME: "false"
      SERVE_LEGACY_UI: "false"
      CYBER_MODEL_ENABLED: "true"
      BEHAVIOR_MODEL_ENABLED: "true"
      MODEL_MANIFEST_PATH: artifacts/release/model-manifest.json
      MAX_REQUEST_SIZE: ${MAX_REQUEST_SIZE:-50MB}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [sentifargo]

  api:
    build:
      context: .
      dockerfile: Dockerfile.production
      target: production
    container_name: sentifargo-api
    restart: unless-stopped
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5
    networks: [sentifargo]
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.production
      target: production
    container_name: sentifargo-worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app.celery worker -l info
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"from app.workers.celery_app import celery; i=celery.control.inspect(timeout=2); p=i.ping() if i else None; raise SystemExit(0 if p else 1)\"",
        ]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5
    networks: [sentifargo]

  gateway:
    build:
      context: services/gateway-kotlin
      dockerfile: Dockerfile
    container_name: sentifargo-gateway
    restart: unless-stopped
    environment:
      PORT: 8081
      SENTIFARGO_FASTAPI_BASE_URL: http://api:8000
      SENTIFARGO_FASTAPI_TIMEOUT_SECONDS: ${SENTIFARGO_FASTAPI_TIMEOUT_SECONDS:-30}
      SENTIFARGO_UPLOAD_BUCKET: ${SENTIFARGO_UPLOAD_BUCKET:-sentifargo-uploads}
      SENTIFARGO_UPLOAD_REGION: ${SENTIFARGO_UPLOAD_REGION:-us-east-1}
      SENTIFARGO_UPLOAD_SIGNED_URL_MINUTES: ${SENTIFARGO_UPLOAD_SIGNED_URL_MINUTES:-15}
      SENTIFARGO_UPLOAD_MAX_BYTES: ${SENTIFARGO_UPLOAD_MAX_BYTES:-104857600}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5
    networks: [sentifargo]

  web:
    build:
      context: ui-web/next
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GRAPHQL_HTTP: ${NEXT_PUBLIC_GRAPHQL_HTTP:-/graphql}
        NEXT_PUBLIC_GRAPHQL_WS: ${NEXT_PUBLIC_GRAPHQL_WS:-/graphql}
        NEXT_PUBLIC_AUTH_MODE: jwt
    container_name: sentifargo-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_GRAPHQL_HTTP: ${NEXT_PUBLIC_GRAPHQL_HTTP:-/graphql}
      NEXT_PUBLIC_GRAPHQL_WS: ${NEXT_PUBLIC_GRAPHQL_WS:-/graphql}
      NEXT_PUBLIC_AUTH_MODE: jwt
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    networks: [sentifargo]

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: sentifargo-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks: [sentifargo]

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: sentifargo-prometheus
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    depends_on:
      api:
        condition: service_healthy
      gateway:
        condition: service_healthy
      redis-exporter:
        condition: service_started
    networks: [sentifargo]

  grafana:
    image: grafana/grafana:10.2.0
    container_name: sentifargo-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://localhost/grafana}
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    networks: [sentifargo]

  nginx:
    image: nginx:alpine
    container_name: sentifargo-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      web:
        condition: service_healthy
      gateway:
        condition: service_healthy
      api:
        condition: service_healthy
    networks: [sentifargo]

networks:
  sentifargo:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
