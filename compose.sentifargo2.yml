version: "3.9"

services:
  sentifargo-api:
    build: .
    container_name: sentifargo_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: sqlite:///./data/Sentifargo.db
      AUTH_BYPASS: "false"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy

  sentifargo-gateway:
    build:
      context: ./services/gateway-kotlin
    container_name: sentifargo_gateway
    ports:
      - "8081:8081"
    environment:
      SENTIFARGO_FASTAPI_BASE_URL: http://sentifargo-api:8000
      SENTIFARGO_UPLOAD_BUCKET: sentifargo-uploads-local
      SENTIFARGO_UPLOAD_REGION: us-east-1
    depends_on:
      - sentifargo-api

  sentifargo-next:
    image: node:20-alpine
    container_name: sentifargo_next
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_GRAPHQL_HTTP: http://localhost:8081/graphql
      NEXT_PUBLIC_GRAPHQL_WS: ws://localhost:8081/graphql
    volumes:
      - ./ui-web/next:/app
    depends_on:
      - sentifargo-gateway

  redis:
    image: redis:7-alpine
    container_name: sentifargo_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: pgvector/pgvector:pg16
    container_name: sentifargo_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sentifargo
      POSTGRES_PASSWORD: sentifargo
      POSTGRES_DB: sentifargo
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
