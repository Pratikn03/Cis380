services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: sentifargo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/sentifargo
      REDIS_URL: redis://redis:6379/0
      AUTH_TOKEN: ${AUTH_TOKEN:-}
      CORS_ORIGINS: http://localhost:3000
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.workers.celery_app.celery worker -l info
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/sentifargo
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - api
      - redis
      - postgres

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    command: >
      mlflow server
      --backend-store-uri postgresql+psycopg2://postgres:postgres@postgres:5432/sentifargo
      --default-artifact-root /mlartifacts
      --host 0.0.0.0
      --port 5000
    ports:
      - "5000:5000"
    volumes:
      - ./mlartifacts:/mlartifacts
    depends_on:
      - postgres

  next:
    working_dir: /app/ui-web/next
    image: node:20
    volumes:
      - ./:/app
    command: bash -lc "cd ui-web/next && npm ci && npm run dev -- --port 3000 --hostname 0.0.0.0"
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
