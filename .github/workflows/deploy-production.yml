name: Deploy Production Frontend (Next.js)

on:
  push:
    branches: [main]
    paths:
      - "ui-web/next/**"
      - ".github/workflows/deploy-production.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "production-frontend-pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build Next.js Static Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui-web/next/package-lock.json

      - name: Install dependencies
        working-directory: ui-web/next
        run: npm install --no-audit --no-fund

      - name: Build production artifact
        working-directory: ui-web/next
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: /Cis380
          NEXT_PUBLIC_GRAPHQL_HTTP: ${{ vars.NEXT_PUBLIC_GRAPHQL_HTTP }}
          NEXT_PUBLIC_GRAPHQL_WS: ${{ vars.NEXT_PUBLIC_GRAPHQL_WS }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ui-web/next/out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
