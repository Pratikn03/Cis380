name: Production CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_PYTHON_VERSION_WARNING: "1"

jobs:
  lint:
    name: Lint + Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy pip-audit
      - name: Ruff
        run: ruff check app tests --output-format=github
      - name: Black
        run: black --check app tests
      - name: MyPy (non-blocking)
        run: mypy app --ignore-missing-imports || true
      - name: Pip Audit (non-blocking)
        run: pip-audit -r requirements.txt || true

  unit-tests:
    name: Unit Tests (smoke)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Run smoke tests
        run: |
          pytest -q \
            tests/test_chat.py \
            tests/test_rag.py \
            tests/test_monitoring.py \
            tests/test_dsa_algorithms_api.py \
            tests/test_api_v1_contract.py \
            tests/test_auth_password.py

  frontend:
    name: Frontend Build (Next.js)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui-web/next/package-lock.json
      - name: Install deps
        run: |
          cd ui-web/next
          npm ci
      - name: Audit (non-blocking)
        run: |
          cd ui-web/next
          npm audit --audit-level=high || true
      - name: Lint
        run: |
          cd ui-web/next
          npm run lint
      - name: Build
        run: |
          cd ui-web/next
          npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Build image
        run: docker build -t sentifargo-api .

  contract-gate:
    name: Contract Gate
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Run contract gate
        run: bash scripts/ci_contract_gate.sh
      - name: Upload contract report
        uses: actions/upload-artifact@v3
        with:
          name: contract-diff
          path: reports/CONTRACT_DIFF.md

  artifact-gate:
    name: Artifact Gate
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Run artifact gate
        run: python scripts/artifact_gate.py
      - name: Upload artifact report
        uses: actions/upload-artifact@v3
        with:
          name: artifact-gate
          path: reports/ARTIFACT_GATE.md

  e2e:
    name: E2E Smoke
    runs-on: ubuntu-latest
    needs: [unit-tests, contract-gate]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Run E2E smoke
        run: bash scripts/ci_e2e.sh

  scorecard:
    name: System Scorecard
    runs-on: ubuntu-latest
    needs: [unit-tests, contract-gate]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Run scorecard
        run: bash scripts/ci_scorecard.sh
      - name: Upload scorecard
        uses: actions/upload-artifact@v3
        with:
          name: system-scorecard
          path: reports/SYSTEM_SCORECARD.md

  full-tests:
    name: Full Test Suite
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx
      - name: Run full tests
        run: pytest tests/ -q --cov=app --cov-report=xml
      - name: Upload coverage
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage.xml

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          format: "sarif"
          output: "trivy-results.sarif"
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
      - name: Safety check
        run: |
          python -m pip install --upgrade pip
          pip install safety
          safety check -r requirements.txt || true

  docker:
    name: Build + Push Docker Image
    runs-on: ubuntu-latest
    needs: [unit-tests, contract-gate, artifact-gate, e2e, scorecard, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
