name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Lint with ruff
        run: ruff check app tests
      - name: Run pytest
        run: pytest tests/test_chat.py tests/test_rag.py tests/test_monitoring.py -q
      - name: Build Docker image
        run: docker build . -t sentinelforge:ci
