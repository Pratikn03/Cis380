# Cyber/intrusion domain override (UNSW-NB15)
project_name: "Sentifargo - Cyber"

data:
  # UNSW-NB15 binary label column
  target: label
  # Prefer a single canonical file to avoid mixing mismatched CSV schemas in data/raw/cyber
  path: data/raw/cyber/UNSW_NB15_training-set.csv
  # Avoid leakage: attack_cat is highly correlated with label
  drop_columns: [id, attack_cat]

training:
  model_type: hist_gb
  n_estimators: 300
  max_depth: 6
  learning_rate: 0.1
  max_iter: 200
  anomaly_contamination: 0.07
