# Fraud domain override
project_name: "Sentifargo - Fraud"

data:
  target: Class
  # Prefer a single canonical file to avoid mixing mismatched schemas under data/raw/fraud
  path: data/raw/fraud/creditcard.csv
  synthetic_rows: 0

training:
  model_type: hist_gb
  n_estimators: 200
  learning_rate: 0.1
  max_depth: 4
  max_iter: 200
  anomaly_contamination: 0.01
